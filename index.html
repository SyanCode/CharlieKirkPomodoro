<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CharlieKirkPomodoro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="work">
  <main id="app">
    <h1>🍅 CharlieKirkPomodoro</h1>
    <div id="phase">Travail</div>
    <div id="timer">25:00</div>

    <div class="controls">
      <button id="startBtn">Démarrer</button>
      <button id="resetBtn" class="secondary">Réinitialiser</button>
    </div>

    <div class="settings">
      <label>Travail (min) <input id="workMin" type="number" min="1" max="180" value="25"></label>
      <label>Pause (min) <input id="breakMin" type="number" min="1" max="60" value="5"></label>
    </div>

    <div class="camera">
      <video id="video" playsinline muted></video>
      <div id="status">Caméra inactive</div>
    </div>

    <details class="memes-config">
      <summary>Mes propres memes</summary>
      <p>Ajoute des images dans <code>memes/</code> et liste-les dans <code>memes/memes.json</code>, ou charge-les ici (non sauvegardées) :</p>
      <input id="memeFiles" type="file" accept="image/*,video/*" multiple>
    </details>
  </main>

  <div id="flood" aria-hidden="true"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
