name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["src/**", "assets/**", "Cargo.toml", "Cargo.lock", "installer/**", ".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release à créer (ex. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  # Numéro de version : tag explicite, sinon 1.0.<numéro d'exécution> (chaque push de code publie une version plus récente).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ -n "${{ inputs.tag }}" ]; then V="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then V="${{ github.ref_name }}"
          else V="1.0.${{ github.run_number }}"; fi
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        shell: pwsh
        run: (Get-Content Cargo.toml) -replace '^version = ".*"$', "version = `"$env:VERSION`"" | Set-Content Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      - name: Download yt-dlp and ffmpeg (bundled in the installer)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/tools | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile installer/tools/yt-dlp.exe
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          Copy-Item ffmpeg/*/bin/ffmpeg.exe, ffmpeg/*/bin/ffprobe.exe installer/tools/

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer/installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: installer/Output/CharlieKirkPomodoro-Setup.exe

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        run: sed -i 's/^version = ".*"$/version = "${{ needs.version.outputs.version }}"/' Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Build .deb
        run: |
          cargo deb
          cp target/debian/*.deb CharlieKirkPomodoro-linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: CharlieKirkPomodoro-linux-amd64.deb

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        run: sed -i '' 's/^version = ".*"$/version = "'"$VERSION"'"/' Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      - name: Build .app and .dmg
        run: |
          APP="dist/CharlieKirkPomodoro.app"
          mkdir -p "$APP/Contents/MacOS"
          cp target/release/charliekirkpomodoro "$APP/Contents/MacOS/"
          mkdir -p "$APP/Contents/Resources"
          cp assets/icon.icns "$APP/Contents/Resources/icon.icns"
          # yt-dlp embarqué à côté de l'exécutable (ffmpeg : brew install ffmpeg)
          curl -fsSL -o "$APP/Contents/MacOS/yt-dlp" https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          chmod +x "$APP/Contents/MacOS/yt-dlp"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>CharlieKirkPomodoro</string>
            <key>CFBundleDisplayName</key><string>CharlieKirkPomodoro</string>
            <key>CFBundleIdentifier</key><string>com.syancode.charliekirkpomodoro</string>
            <key>CFBundleExecutable</key><string>charliekirkpomodoro</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSCameraUsageDescription</key><string>CharlieKirkPomodoro utilise la caméra pour savoir si tu regardes l'écran.</string>
          </dict>
          </plist>
          PLIST
          codesign --force --deep -s - "$APP"
          hdiutil create -volname CharlieKirkPomodoro -srcfolder dist -ov -format UDZO CharlieKirkPomodoro-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: CharlieKirkPomodoro-macos.dmg

  publish:
    needs: [version, windows, linux, macos]
    # Publie ce qui a réussi, même si une plateforme échoue.
    if: ${{ !cancelled() && contains(needs.*.result, 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/*
          fail_on_unmatched_files: false
          generate_release_notes: true
