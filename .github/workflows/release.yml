name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release à créer (ex. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Download yt-dlp and ffmpeg (bundled in the installer)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/tools | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile installer/tools/yt-dlp.exe
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          Copy-Item ffmpeg/*/bin/ffmpeg.exe, ffmpeg/*/bin/ffprobe.exe installer/tools/
          Get-ChildItem installer/tools

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = "${{ inputs.tag || github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer/installer.iss
          Get-ChildItem installer/Output

      - uses: actions/upload-artifact@v4
        with:
          name: CharlieKirkPomodoro-Setup
          path: installer/Output/CharlieKirkPomodoro-Setup.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: installer/Output/CharlieKirkPomodoro-Setup.exe
          generate_release_notes: true
