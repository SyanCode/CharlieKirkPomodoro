[package]
name = "charliekirkpomodoro"
version = "1.0.0"
edition = "2021"
description = "Pomodoro qui flood l'écran de memes quand tu détournes le regard"
license = "MIT"

[dependencies]
eframe = "0.37"
nokhwa = { version = "0.10", features = ["input-native"] }
rustface = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
directories = "6"
open = "5"
ureq = "3"
serde_json = "1"
rand = "0.9"
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "wav", "flac", "vorbis"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true

[package.metadata.deb]
maintainer = "SyanCode"
section = "utils"
priority = "optional"
depends = "$auto, ffmpeg, libxkbcommon-x11-0, libgl1"
recommends = "yt-dlp"
extended-description = "Pomodoro avec détection du regard par webcam : des memes inondent l'écran quand tu détournes la tête."
assets = [
    ["target/release/charliekirkpomodoro", "usr/bin/", "755"],
    ["installer/charliekirkpomodoro.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/256x256/apps/charliekirkpomodoro.png", "644"],
]
