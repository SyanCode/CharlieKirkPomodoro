<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CharlieKirkPomodoro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="work">
  <main id="app">
    <h1>🍅 CharlieKirkPomodoro</h1>
    <div id="phase">Travail</div>
    <div id="timer">25:00</div>

    <div class="controls">
      <button id="startBtn">Démarrer</button>
      <button id="resetBtn" class="secondary">Réinitialiser</button>
    </div>

    <div class="settings">
      <label>Travail (min) <input id="workMin" type="number" min="1" max="180" value="25"></label>
      <label>Pause (min) <input id="breakMin" type="number" min="1" max="60" value="5"></label>
    </div>

    <div class="camera">
      <video id="video" playsinline muted></video>
      <div id="status">Caméra inactive</div>
    </div>

    <div class="memes-config">
      <button id="memesBtn" class="secondary">📂 Dossier des memes</button>
      <p>Dépose tes images/vidéos (png, jpg, gif, webp, mp4, webm) dans ce dossier, puis relance l'appli.</p>
    </div>
  </main>

  <div id="flood" aria-hidden="true"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
